services:
  - type: web
    name: medcontrol-clinical-suite
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/medcontrol.db